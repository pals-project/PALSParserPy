name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout PALSParserPy repository
        uses: actions/checkout@v7
        with:
          path: PALSParserPy

      - name: Checkout PALSParserCpp repository
        uses: actions/checkout@v7
        with:
          repository: pals-project/PALSParserCpp
          path: PALSParserCpp

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # PALSParserCpp fetches rapidyaml (and the rest) itself via CMake FetchContent,
      # so a compiler and CMake are all that is needed. Every runner ships CMake
      # preinstalled, and macOS and Windows a compiler (Visual Studio on Windows);
      # only Linux needs one pulled in explicitly.
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      # `cmake --build` rather than make, which the Visual Studio generator does
      # not use. Visual Studio picks the configuration at build time and writes
      # build/Release/PALSParserCpp.dll; the other generators ignore --config.
      - name: Build C++ library
        run: |
          cd PALSParserCpp
          cmake -S . -B build
          cmake --build build --config Release --parallel
          ls -lah build build/Release 2>/dev/null || true
        shell: bash

      # PALSParserPy finds ../PALSParserCpp/build/ (or build/Release/) by itself,
      # which is the layout the two checkouts above make. pytest puts the
      # checkout on sys.path, so the package needs no install; pytest itself does.
      - name: Run tests
        run: |
          cd $GITHUB_WORKSPACE/PALSParserPy
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -v
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            PALSParserPy/*.log
            PALSParserPy/lattice_files/*_out.*
          if-no-files-found: ignore
