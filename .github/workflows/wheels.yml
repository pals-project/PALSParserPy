name: Wheels
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYCODE'
          import ast, os, pathlib, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          tree = ast.parse(pathlib.Path('palsparserpy/__init__.py').read_text())
          declared = [ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets)]
          assert declared == [version], declared
          PYCODE
      - run: python -m pip install -r requirements-wheels.txt
      - name: Verify clean tag archives build pure Python without native sources
        run: |
          mkdir "$RUNNER_TEMP/pure-python"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pure-python"
          python -m build --wheel "$RUNNER_TEMP/pure-python" --outdir "$RUNNER_TEMP/pure-wheel"
          python - <<'PYCODE'
          import os, pathlib, zipfile
          wheel = next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'pure-wheel').glob('*.whl'))
          assert wheel.name.endswith('-py3-none-any.whl'), wheel
          with zipfile.ZipFile(wheel) as archive:
              assert not any(n.endswith(('.dll', '.so', '.dylib')) for n in archive.namelist())
          assert not (pathlib.Path(os.environ['RUNNER_TEMP']) / 'pure-python' / 'vendor').exists()
          PYCODE
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
  wheels:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract complete source distribution
        shell: bash
        run: |
          mkdir package
          tar -xf source/*.tar.gz -C package --strip-components=1
      - run: python -m pip install -r package/requirements-wheels.txt
      - name: Build, repair and test wheel from sdist
        working-directory: package
        run: python -m cibuildwheel . --output-dir ../wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
  uv:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-ubuntu-*
          path: wheelhouse
          merge-multiple: true
      - uses: astral-sh/setup-uv@v7
      - name: Test installed wheel with uv on current Python
        run: |
          uv venv --python 3.14
          uv pip install wheelhouse/*.whl pytest
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/tools/test_installed.py" "$GITHUB_WORKSPACE"
  publish:
    if: github.repository == 'pals-project/PALSParserPy' && github.event_name == 'release' && !github.event.release.prerelease
    needs: [source, wheels, uv]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/palsparserpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
