[build-system]
requires = ["setuptools>=77", "wheel", "cmake>=3.18"]
build-backend = "setuptools.build_meta"

[project]
name = "palsparserpy"
version = "0.0.1"
description = "Python interface for Particle Accelerator Language Standard (PALS) files"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "David Sagan", email = "david.sagan@gmail.com" },
]
keywords = ["PALS", "accelerator", "lattice", "Bmad", "MAD-X", "YAML"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# Native dependencies are bundled in PyPI wheels; conda supplies them separately.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx", "myst-parser", "sphinx-book-theme"]

[project.urls]
Homepage = "https://github.com/pals-project/PALSParserPy"
"PALS standard" = "https://github.com/campa-consortium/pals"
"C library" = "https://github.com/pals-project/PALSParserCpp"

[tool.setuptools]
packages = ["palsparserpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp310-*"
skip = ["*-musllinux_*", "*-manylinux_i686", "*-win32"]
test-requires = ["pytest"]
test-command = "python {project}/tools/test_installed.py {project}"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
